# What this package declares about itself.
#
# The declaration is capability, not intent: the package's own suite compares it
# with what the code calls, because `aru doctor` reads the application and never
# opens an installed package.

name = "hyz-is/rating"
framework = ">= 0.67"
profiles = ["conventional", "performance"]

[permissions]
# It answers requests and reads its own rows. Nothing leaves the process: a
# message is the application's Notifier's to send, and the package sends none.
network = false
# It opens no file of its own, and keeps no state outside the database.
filesystem = false
# It runs no other program.
exec = false
# migrations.go owns two tables, so whoever installs this has to run
# `aru migrate`. Declaring it is how they find that out before deploying.
migrations = true
